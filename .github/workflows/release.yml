# =============================================================================
# Release Pipeline for nx-astro plugin
# =============================================================================
#
# Purpose:
#   Automated npm staged publishing with provenance after local versioning.
#
# Workflow:
#   1. Developer runs `pnpx nx release` locally to version and create git tag
#   2. Developer pushes tag to GitHub: `git push --tags`
#   3. This workflow automatically triggers on tag push
#   4. Workflow builds, tests, and stages the version on npm with provenance
#   5. Workflow creates GitHub release
#   6. Maintainer approves the staged version on npmjs.com (2FA), which
#      makes it public
#
# Triggers:
#   - Automatic: Push of version tags (v*.*.*)
#   - Manual: workflow_dispatch with an existing tag (re-stages that tag)
#
# Authentication (npm Trusted Publishing):
#   - No npm token is stored in the repository
#   - npm trusts this workflow (Geekvetica/nx-astro, release.yml) via OIDC
#   - Configure on npmjs.com: package Settings -> Trusted Publisher -> GitHub Actions
#   - The trusted publisher allows staged publishing only ("Allow npm publish"
#     unchecked), so this workflow can never make a version public by itself
#   - Requires npm >= 11.15.0 for `npm stage publish`
#   - GITHUB_TOKEN: Automatically provided by GitHub Actions
#
# Security:
#   - Short-lived OIDC credentials, nothing to rotate or leak
#   - A human approves every release with 2FA before it is public
#   - Only release commits on main are staged (see "Verify release tag")
#   - v* tags are protected by a GitHub tag ruleset (admins only)
#   - Minimal permissions with id-token for OIDC
#
# Provenance:
#   - Publishes with npm provenance statements
#   - Creates cryptographically verifiable attestations
#   - Links published package to source code and build process
#   - Only available when publishing from GitHub Actions
#
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example: v2.0.0)'
        required: true
        type: string

# Only allow one release at a time
concurrency:
  group: release
  cancel-in-progress: false

# Permissions required for npm Trusted Publishing (OIDC)
permissions:
  contents: write # Create releases
  packages: write # Publish packages
  id-token: write # OIDC token for npm Trusted Publishing and provenance

env:
  NODE_VERSION: '24.x'

jobs:
  # ===========================================================================
  # Job 1: Run Tests and Lint
  # ===========================================================================
  # Purpose:
  #   - Refuse tags that are not `nx release` release commits on main
  #   - Run linting and unit tests before publishing
  #   - E2E tests are skipped in release workflow (they run in CI)
  #   - Fail fast if any tests fail
  # ===========================================================================
  test:
    name: Run Tests and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Only stage tags created by `nx release`: the tag must point to the
          # release commit for its version, and that commit must be on main.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "✗ Invalid tag format: $TAG"
            exit 1
          fi
          VERSION=${TAG#v}

          SUBJECT=$(git log -1 --format=%s HEAD)
          if [ "$SUBJECT" != "chore(release): publish $VERSION" ]; then
            echo "✗ $TAG does not point to a release commit (subject: $SUBJECT)"
            exit 1
          fi

          PACKAGE_VERSION=$(jq -r .version nx-astro/package.json)
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "✗ nx-astro/package.json has version $PACKAGE_VERSION, expected $VERSION"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "✗ $TAG is not on main"
            exit 1
          fi

          echo "✓ $TAG is the release commit for $VERSION on main"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpx nx run-many -t lint --all --parallel=3

      - name: Run unit tests
        run: pnpx nx run-many -t test --all --parallel=3 --configuration=ci

  # ===========================================================================
  # Job 2: Stage on npm
  # ===========================================================================
  # Purpose:
  #   - Stage the version on the npm registry with provenance
  #   - Point the maintainer to the approval step
  # ===========================================================================
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install npm with staged publishing support
        run: |
          npm install -g npm@^11.15.0
          npm --version

      - name: Build plugin
        run: pnpx nx build nx-astro

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.tag }}"
            if [ -z "$RAW_TAG" ]; then
              echo "✗ Missing required input: tag"
              exit 1
            fi

            if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "✗ Invalid tag format: $RAW_TAG"
              echo "Expected format: v<major>.<minor>.<patch> (optional prerelease suffix)"
              exit 1
            fi

            VERSION=${RAW_TAG#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Stage on npm with provenance
        run: |
          # Stage the built package from dist directory via npm Trusted
          # Publishing: npm exchanges this job's OIDC token for a short-lived
          # credential, so no NPM_TOKEN secret is needed. A staged version is
          # not public until a maintainer approves it with 2FA. This requires:
          #   - id-token: write permission (set above)
          #   - A trusted publisher for release.yml configured on npmjs.com
          #   - npm >= 11.15.0
          cd dist/nx-astro
          npm stage publish --access public --provenance

      - name: Point to approval
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "### @geekvetica/nx-astro@$VERSION is staged on npm"
            echo
            echo "It is not public yet. Approve it with 2FA in the **Staged Packages** tab:"
            echo "https://www.npmjs.com/package/@geekvetica/nx-astro"
            echo
            echo "After approval, verify with:"
            echo '```'
            echo "npm view @geekvetica/nx-astro@$VERSION version"
            echo "npm audit signatures"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ Staged version $VERSION; approve it on npmjs.com to publish"

  # ===========================================================================
  # Job 3: Create GitHub Release
  # ===========================================================================
  # Purpose:
  #   - Create GitHub release with changelog
  #   - Link to npm package
  # ===========================================================================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.tag }}"
            if [ -z "$RAW_TAG" ]; then
              echo "✗ Missing required input: tag"
              exit 1
            fi

            VERSION=${RAW_TAG#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Check if CHANGELOG.md exists
          if [ -f "CHANGELOG.md" ]; then
            # Extract changelog section for this version using awk
            CHANGELOG=$(awk -v ver="$VERSION" '
              /^## / {
                if (found) exit;
                if ($0 ~ ver) found=1;
                next;
              }
              found { print }
            ' CHANGELOG.md)

            if [ -n "$CHANGELOG" ]; then
              echo "changelog<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGELOG" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "changelog=Release $VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "changelog=Release $VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ steps.version.outputs.version }}
          body: |
            # nx-astro v${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ```bash
            npm install @geekvetica/nx-astro@${{ steps.version.outputs.version }}
            # or
            pnpm add @geekvetica/nx-astro@${{ steps.version.outputs.version }}
            ```

            ## Provenance

            This package was published with npm provenance. Verify with:
            ```bash
            npm audit signatures
            ```

            ## Documentation

            See the [README](https://github.com/${{ github.repository }}) for usage instructions.
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on success
        run: |
          echo "✓ Successfully created GitHub release"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"
